name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build WindowsUpdateAndPackageManager.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test tests/WindowsUpdateAndPackageManager.Tests/WindowsUpdateAndPackageManager.Tests.csproj --no-build --configuration Release --verbosity normal
      - name: Publish Wupm.Cli
        run: dotnet publish src/Wupm.Cli/Wupm.Cli.csproj --no-build -c Release -o ${{ github.workspace }}/publish/cli
      - name: Publish WupmApi
        run: dotnet publish src/WupmApi/WupmApi.csproj --no-build -c Release -o ${{ github.workspace }}/publish/api
      - name: Zip artifacts
        run: |
          Compress-Archive -Path ${{ github.workspace }}/publish/cli/* -DestinationPath ${{ github.workspace }}/wupm-cli.zip
          Compress-Archive -Path ${{ github.workspace }}/publish/api/* -DestinationPath ${{ github.workspace }}/wupm-api.zip
      - name: Generate SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $components = @()
          foreach ($proj in @("src/WindowsUpdateAndPackageManager.Core/WindowsUpdateAndPackageManager.Core.csproj","src/Wupm.Cli/Wupm.Cli.csproj","src/WupmApi/WupmApi.csproj")) {
            $props = Get-Content $proj | Select-String -Pattern '<AssemblyVersion>|<FileVersion>|<PackageVersion>|<Version>' -SimpleMatch
            foreach ($p in $props) {
              $components += @{
                type = "library"
                name = [System.IO.Path]::GetFileNameWithoutExtension($proj)
                version = "1.0.0"
                description = $p.Line.Trim()
              }
            }
          }
          $sbom = @{
            bomFormat = "CycloneDX"
            specVersion = "1.5"
            version = 1
            components = $components
          }
          $sbom | ConvertTo-Json -Depth 5 | Out-File -FilePath '${{ github.workspace }}/sbom.json'
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/wupm-cli.zip
            ${{ github.workspace }}/wupm-api.zip
            ${{ github.workspace }}/sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check signing secrets
        id: signing_check
        shell: bash
        run: |
          if [ -n "${{ secrets.AZURE_SIGNING_CLIENT_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign release artifacts
        if: steps.signing_check.outputs.enabled == 'true'
        env:
          AZURE_SIGNING_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          AZURE_SIGNING_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          AZURE_SIGNING_SECRET: ${{ secrets.AZURE_SIGNING_SECRET }}
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = '${{ github.workspace }}'
          $files = @('$artifactDir/wupm-cli.zip', '$artifactDir/wupm-api.zip')
          if (Get-Command azuresigntool -ErrorAction SilentlyContinue) {
            foreach ($f in $files) {
              azuresigntool sign `
                --azure-key-vault-url 'https://${{ secrets.AZURE_KEY_VAULT_URL }}/' `
                --azure-key-vault-client-id $env:AZURE_SIGNING_CLIENT_ID `
                --azure-key-vault-tenant-id $env:AZURE_SIGNING_TENANT_ID `
                --azure-key-vault-secret $env:AZURE_SIGNING_SECRET `
                --azure-key-vault-certificate 'WUPMSigningCert' `
                --timestamp-server 'http://timestamp.digicert.com' `
                --file $f
            }
            Write-Host 'Signed artifacts with AzureSignTool.'
            exit 0
          }
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          if ($null -eq $cert) { Write-Host 'No code-signing certificate found; skipping signing.'; exit 0; }
          foreach ($f in $files) {
            Set-AuthenticodeSignature -FilePath $f -Certificate $cert -TimestampServer 'http://timestamp.digicert.com'
          }
          Write-Host 'Signed artifacts with local certificate.'
