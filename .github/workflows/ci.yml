name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/WindowsUpdateAndPackageManager.Core/WindowsUpdateAndPackageManager.csproj -c Release
      - run: dotnet build src/WupmApi/WupmApi.csproj -c Release
      - run: dotnet build src/Wupm.Cli/Wupm.Cli.csproj -c Release
      - run: dotnet build src/WupmGui/WupmGui.csproj -c Release
      - run: dotnet test tests/WindowsUpdateAndPackageManager.Tests/WindowsUpdateAndPackageManager.Tests.csproj -c Release --verbosity quiet
