name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build WindowsUpdateAndPackageManager.sln --no-restore
      - name: Test
        run: dotnet test tests/WindowsUpdateAndPackageManager.Tests/WindowsUpdateAndPackageManager.Tests.csproj --no-build --verbosity normal
      - name: Publish outputs
        run: |
          dotnet publish src/Wupm.Cli/Wupm.Cli.csproj --no-build -c Release -o ${{ github.workspace }}/publish/cli
          dotnet publish src/WupmApi/WupmApi.csproj --no-build -c Release -o ${{ github.workspace }}/publish/api
      - name: Zip artifacts
        run: |
          Compress-Archive -Path ${{ github.workspace }}/publish/cli/* -DestinationPath ${{ github.workspace }}/wupm-cli.zip
          Compress-Archive -Path ${{ github.workspace }}/publish/api/* -DestinationPath ${{ github.workspace }}/wupm-api.zip
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wupm-artifacts
          path: |
            ${{ github.workspace }}/wupm-cli.zip
            ${{ github.workspace }}/wupm-api.zip
