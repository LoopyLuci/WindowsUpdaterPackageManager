apiVersion: v1
kind: Namespace
metadata:
  name: wupm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wupm-api-config
  namespace: wupm
data:
  WUPM_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wupm-api
  namespace: wupm
  labels:
    app: wupm-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wupm-api
  template:
    metadata:
      labels:
        app: wupm-api
    spec:
      containers:
        - name: wupm-api
          image: ghcr.io/loopyluci/wupm-api:0.1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: wupm-api-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: wupm-api
  namespace: wupm
spec:
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: wupm-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wupm-api
  namespace: wupm
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - wupm.example.com
      secretName: wupm-tls
  rules:
    - host: wupm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wupm-api
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wupm-api
  namespace: wupm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wupm-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
